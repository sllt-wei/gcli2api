<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创意创作中心 | GCLI2API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #ec4899;
            --bg-dark: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 动态背景背景 */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.05) 0%, transparent 60%);
            animation: pulseBg 20s ease-in-out infinite alternate;
        }

        @keyframes pulseBg {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: -0.02em;
        }

        header p {
            color: var(--text-dim);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* 核心布局 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 玻璃面板 */
        .panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .panel:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* 提示词输入 */
        .prompt-section h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .prompt-container {
            position: relative;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            color: var(--text-main);
            font-size: 1.1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: rgba(15, 23, 42, 0.8);
        }

        .char-count {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        /* 生成按钮 */
        .generate-btn {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px -10px var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            overflow: hidden;
            position: relative;
        }

        .generate-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px -12px var(--primary);
            filter: brightness(1.1);
        }

        .generate-btn:active {
            transform: scale(0.98);
        }

        .generate-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
            pointer-events: none;
        }

        .generate-btn:hover::after {
            left: 120%;
        }

        /* 配置项样式 */
        .setting-group {
            margin-bottom: 25px;
        }

        .setting-label {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: block;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .option-card.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        /* 结果画廊 */
        .result-section {
            margin-top: 40px;
        }

        .gallery-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .image-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
            aspect-ratio: 16/9;
            cursor: zoom-in;
            border: 1px solid var(--glass-border);
            animation: fadeInUp 0.5s ease-out;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .image-card:hover img {
            transform: scale(1.05);
        }

        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-card:hover .image-overlay {
            opacity: 1;
        }

        /* 状态指示器 */
        .status-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        .toast {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .toast.show {
            transform: translateX(0);
        }

        /* 进度动画 */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: var(--primary);
            width: 0;
            transition: width 0.3s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 加载动画 */
        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-dim);
            grid-column: 1 / -1;
        }

        .empty-state i {
            display: block;
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="container">
        <header>
            <h1>Creative Studio</h1>
            <p>基于 Gemini 3.1 & Antigravity 的高阶人工智能创作中心</p>
        </header>

        <div class="main-grid">
            <!-- 左侧：输入区域 -->
            <div class="panel prompt-section">
                <h2>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg>
                    创意描述
                </h2>
                <div class="prompt-container">
                    <textarea id="promptInput" placeholder="描述你想要生成的画面，例如：一只赛博朋克风格的猫，在繁华的霓虹都市中行走，电影质感，细节丰富..."></textarea>
                    <div class="char-count"><span id="currentCount">0</span>/2000</div>
                </div>
                <button id="generateBtn" class="generate-btn">
                    <span>开始创造</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
                </button>
            </div>

            <!-- 右侧：配置区域 -->
            <div class="panel settings-section">
                <div class="setting-group">
                    <span class="setting-label">选择模型</span>
                    <div class="option-grid" style="grid-template-columns: 1fr;">
                        <div class="option-card active" data-type="model" data-value="gemini-3.1-flash-image">Gemini 3.1 Flash Image</div>
                        <div class="option-card" data-type="model" data-value="gemini-2.5-pro">Gemini 2.5 Pro (Text)</div>
                    </div>
                </div>

                <div class="setting-group">
                    <span class="setting-label">分辨率</span>
                    <div class="option-grid">
                        <div class="option-card" data-type="res" data-value="">默认</div>
                        <div class="option-card active" data-type="res" data-value="-2k">2K</div>
                        <div class="option-card" data-type="res" data-value="-4k">4K</div>
                    </div>
                </div>

                <div class="setting-group">
                    <span class="setting-label">画面比例</span>
                    <div class="option-grid">
                        <div class="option-card active" data-type="ratio" data-value="-1x1">1:1</div>
                        <div class="option-card" data-type="ratio" data-value="-16x9">16:9</div>
                        <div class="option-card" data-type="ratio" data-value="-9x16">9:16</div>
                        <div class="option-card" data-type="ratio" data-value="-4x3">4:3</div>
                    </div>
                </div>

                <div class="setting-group">
                    <span class="setting-label">思考预算 (Text Only)</span>
                    <div class="option-grid">
                        <div class="option-card active" data-type="thinking" data-value="none">关闭</div>
                        <div class="option-card" data-type="thinking" data-value="-low">低</div>
                        <div class="option-card" data-type="thinking" data-value="-high">高</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="result-section">
            <div class="gallery-head">
                <h2>作品画廊</h2>
                <button style="background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.9rem;">清空画廊</button>
            </div>
            <div class="gallery-grid" id="gallery">
                <!-- 空状态 -->
                <div class="empty-state">
                    <i><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg></i>
                    <p>暂无作品，快去描述你的灵感吧</p>
                </div>
            </div>
        </div>
    </div>

    <div class="status-container" id="statusContainer"></div>

    <script>
        // 配置管理
        const config = {
            model: 'gemini-3.1-flash-image',
            res: '-2k',
            ratio: '-1x1',
            thinking: 'none'
        };

        // UI 元素
        const promptInput = document.getElementById('promptInput');
        const charCount = document.getElementById('currentCount');
        const generateBtn = document.getElementById('generateBtn');
        const gallery = document.getElementById('gallery');
        const statusContainer = document.getElementById('statusContainer');

        // 字数统计
        promptInput.addEventListener('input', (e) => {
            charCount.textContent = e.target.value.length;
        });

        // 选项卡切换
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', () => {
                const type = card.dataset.type;
                const value = card.dataset.value;

                // 移除同组激活
                document.querySelectorAll(`.option-card[data-type="${type}"]`).forEach(c => c.classList.remove('active'));
                card.classList.add('active');

                config[type] = value;
                console.log('Update Config:', config);
            });
        });

        // Toast 消息
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast show`;
            toast.style.borderColor = type === 'error' ? '#ef4444' : (type === 'success' ? '#10b981' : 'var(--glass-border)');
            toast.innerHTML = `
                ${type === 'loading' ? '<div class="loader"></div>' : ''}
                <span>${message}</span>
            `;
            statusContainer.appendChild(toast);
            
            if (type !== 'loading') {
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 4000);
            }
            return toast;
        }

        // 生成逻辑
        generateBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                showToast('请输入创意描述后再开始', 'error');
                return;
            }

            // 构造模型名称
            let finalModel = config.model;
            if (config.model.includes('image')) {
                finalModel += config.res + config.ratio;
            } else if (config.thinking !== 'none') {
                finalModel += config.thinking; // 例如 gemini-2.5-pro-high
            }

            // UI 状态
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<div class="loader"></div><span>正在创造...</span>';
            const loadingToast = showToast(`正在调用 ${finalModel} 创造灵感...`, 'loading');

            try {
                // 这里调用 API
                const password = localStorage.getItem('panel_password') || 'pwd';
                
                // 本地/生产环境适配
                const baseUrl = window.location.origin;
                
                const response = await fetch(`${baseUrl}/v1/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${password}`
                    },
                    body: JSON.stringify({
                        model: finalModel,
                        messages: [{ role: 'user', content: prompt }],
                        stream: false
                    })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error?.message || '生成失败');

                // 处理回显
                const content = data.choices[0].message.content;
                
                // 如果是图像模型，通常 content 会包含 Markdown 图片语法或 Base64
                // 在 gcli2api 中，如果是生成的图，通常会直接显示在 content 里
                addResultToGallery(content, prompt, finalModel);
                
                loadingToast.remove();
                showToast('创造成功！', 'success');
            } catch (err) {
                console.error(err);
                loadingToast.remove();
                showToast('创造失败: ' + err.message, 'error');
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<span>开始创造</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>';
            }
        });

        function addResultToGallery(content, prompt, model) {
            // 移除空状态
            const empty = gallery.querySelector('.empty-state');
            if (empty) empty.remove();

            const card = document.createElement('div');
            card.className = 'image-card';
            
            // 解析图片 URL (假设格式是 Markdown ![image](url))
            const imgMatch = content.match(/!\[.*?\]\((.*?)\)/);
            const imgSrc = imgMatch ? imgMatch[1] : null;

            if (imgSrc) {
                card.innerHTML = `
                    <img src="${imgSrc}" alt="${prompt}">
                    <div class="image-overlay">
                        <div style="font-size: 0.8rem; font-weight: 600; margin-bottom: 5px;">${model}</div>
                        <div style="font-size: 0.7rem; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${prompt}</div>
                    </div>
                    <div class="progress-bar" style="width: 100%"></div>
                `;
            } else {
                // 如果是文本回复
                card.style.aspectRatio = 'auto';
                card.style.minHeight = '150px';
                card.style.padding = '20px';
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.display = 'flex';
                card.style.flexDirection = 'column';
                card.style.cursor = 'default';
                card.innerHTML = `
                    <div style="font-size: 0.75rem; color: var(--primary); margin-bottom: 10px;">${model}</div>
                    <div style="font-size: 0.9rem; line-height: 1.5; color: var(--text-main); font-weight: 300;">${content}</div>
                    <div style="margin-top: auto; padding-top: 15px; font-size: 0.7rem; color: var(--text-dim); border-top: 1px solid var(--glass-border);">Prompt: ${prompt}</div>
                `;
            }

            gallery.prepend(card);
        }

        // 初始化密码
        if (!localStorage.getItem('panel_password')) {
            // 尝试获取 URL 参数或询问
            const params = new URLSearchParams(window.location.search);
            if (params.has('pwd')) localStorage.setItem('panel_password', params.get('pwd'));
        }
    </script>
</body>
</html>
